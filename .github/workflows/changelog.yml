name: Changelog

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-changelog:
    # Skip for fork PRs - we can't write to forks and can't checkout their branches.
    # Skip for Dependabot PRs - they don't have access to ANTHROPIC_API_KEY and dep
    # bumps are summarized in the release PR by the changelogs action itself.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@05c669ce878b8719779a28fe7375ba85822403f8 # main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.105

      - name: Check changelogs
        uses: ./check
        timeout-minutes: 5
        with:
          ai: 'claude -p --dangerously-skip-permissions'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # zizmor: ignore[secrets-outside-env] Changelog generation is intentionally limited to same-repository, non-Dependabot PRs above.
