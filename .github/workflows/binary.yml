name: Binary Releases

on:
  push:
    tags:
      - 'changelogs@*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. changelogs@0.3.0)'
        required: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: changelogs-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: changelogs-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: changelogs-darwin-arm64
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          target: ${{ matrix.target }}
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name != 'push' }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: strip target/${{ matrix.target }}/release/changelogs
      - run: mv target/${{ matrix.target }}/release/changelogs ${{ matrix.asset }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  upload:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - uses: tempoxyz/gh-actions/actions/gh-release@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*
      - uses: tempoxyz/gh-actions/actions/gh-release@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          tag: latest
          prerelease: true
          files: artifacts/*
          body: "Latest build from ${{ inputs.tag || github.ref_name }}. Updated on every release."
