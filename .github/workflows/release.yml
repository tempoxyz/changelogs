name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Version
    if: github.repository == 'tempoxyz/changelogs' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@bd66336ead0e97e3939428f526dc61fb43db0996 # 2026-09-25T20-13-44Z-bd66336e

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Rust
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@bd66336ead0e97e3939428f526dc61fb43db0996 # 2026-09-25T20-13-44Z-bd66336e

      - name: Install changelogs
        run: cargo install --path .

      - name: Fetch GitHub token via STS
        id: app-token
        uses: tempoxyz/gh-actions/actions/github-sts@bd66336ead0e97e3939428f526dc61fb43db0996 # 2026-09-25T20-13-44Z-bd66336e
        with:
          policy: release

      - name: Changelogs
        id: changelogs
        uses: ./
        with:
          crate-token: ${{ secrets.CARGO_REGISTRY_TOKEN }} # zizmor: ignore[secrets-outside-env] Publishing is restricted to pushes on the protected master branch above.
          conventional-commit: true
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Build release binaries
        if: steps.changelogs.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            gh workflow run binary.yml \
              --ref "$GITHUB_REF_NAME" \
              --field tag="$tag"
          done
